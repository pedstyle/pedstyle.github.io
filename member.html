<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEDSTYLE - MEMBERS</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Kanit:wght@200;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            --primary: #ffffff;
            --accent: #f3d48b;
            --bg-dark: #08080a;
            --card-bg: rgba(20, 20, 24, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #ff4757;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; scroll-behavior: smooth; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #14141c 0%, #050508 100%);
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            color: #fff;
            font-family: 'Kanit', 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Custom Modals --- */
        .custom-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-box {
            background: #111116; border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 420px;
            text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 255, 0.05);
        }
        .modal-box h3 { font-family: 'Orbitron'; margin-bottom: 20px; color: #fff; letter-spacing: 2px; font-size: 1.1rem; }

        #video-jumpscare {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: none; pointer-events: none;
        }
        #video-jumpscare iframe { width: 100%; height: 100%; border: none; }

        /* --- Navigation --- */
        nav { 
            display: flex; justify-content: space-between; padding: 18px 6%; 
            background: rgba(10, 10, 14, 0.85); align-items: center; position: sticky; 
            top: 0; z-index: 100; backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border-color);
        }
        #brand-name { 
            font-weight: 900; letter-spacing: 3px; font-family: 'Orbitron'; font-size: 1.15rem; color: #fff;
            display: flex; align-items: center; gap: 12px;
        }
        #brand-name img { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,255,255,0.7)); }

        .container { max-width: 960px; margin: 0 auto; padding: 35px 20px 80px; }

        /* --- Admin Panel --- */
        .glass-panel {
            background: rgba(16, 16, 22, 0.85); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px; padding: 25px; margin-bottom: 35px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }

        .input-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .input-group label { font-size: 0.82rem; color: rgba(255, 255, 255, 0.7); font-family: 'Kanit'; }

        input, select { 
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-color); padding: 12px 14px; 
            color: #fff; border-radius: 10px; font-family: 'Kanit'; outline: none; width: 100%;
            transition: border 0.3s; font-size: 0.9rem;
        }
        input:focus, select:focus { border-color: rgba(255, 255, 255, 0.4); }

        .btn-action { 
            background: #ffffff; color: #000; border: none; padding: 10px 22px; 
            border-radius: 10px; font-weight: 700; font-family: 'Orbitron'; cursor: pointer; 
            transition: var(--transition); display: inline-flex; align-items: center; gap: 8px;
            justify-content: center; width: auto; font-size: 0.8rem; letter-spacing: 1px;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

        /* --- Section Header with Lines --- */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 45px 0 25px;
        }
        .header-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }
        .section-title-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }
        .header-icon {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
        }
        .section-count {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            font-weight: 400;
            font-family: 'Orbitron', sans-serif;
        }

        /* --- Cards Grid (2 Columns) --- */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 16px;
        }

        /* --- Member Card Styling (Exact Match) --- */
        .member-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .member-card:hover {
            background: rgba(28, 28, 34, 0.85);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .card-main {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .avatar-wrap {
            position: relative;
            width: 54px;
            height: 54px;
            flex-shrink: 0;
            margin-right: 15px;
        }
        .card-avatar {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            object-fit: contain;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
        }
        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 9px;
            height: 9px;
            background: #ffffff;
            border: 2px solid #141418;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        .card-name {
            font-family: 'Kanit', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-role-badge {
            display: inline-block;
            align-self: flex-start;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 3px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
        }

        .card-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            height: 54px;
            margin-left: 15px;
            flex-shrink: 0;
        }
        .role-crown {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75);
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }

        .social-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .card-social-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .card-social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Admin Mini Edit/Delete Controls */
        .admin-mini-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            justify-content: flex-end;
            width: 100%;
        }
        .mini-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }
        .mini-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }

        .toast { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            background: #fff; color: #000; padding: 12px 35px; 
            border-radius: 50px; font-weight: 900; z-index: 10001; font-size: 0.85rem;
            font-family: 'Kanit', 'Orbitron'; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Empty State */
        .empty-placeholder {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Kanit';
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .roster-grid { grid-template-columns: 1fr; }
            nav { padding: 15px 4%; }
            #brand-name { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div id="video-jumpscare"></div>

    <!-- Admin Login Modal -->
    <div id="loginModal" class="custom-modal">
        <div class="modal-box">
            <h3>ADMIN LOGIN</h3>
            <input type="password" id="adminPassInput" placeholder="ENTER PASSWORD" onkeydown="if(event.key === 'Enter') handleAdminLogin()">
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button onclick="handleAdminLogin()" class="btn-action">LOGIN</button>
                <button onclick="closeModal('loginModal')" class="btn-action btn-secondary">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmModal" class="custom-modal">
        <div class="modal-box">
            <h3 style="color: var(--danger);">DELETE MEMBER?</h3>
            <p id="deleteMemberName" style="margin-bottom: 20px; font-family: 'Kanit'; color: rgba(255,255,255,0.7);"></p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="confirmDeleteBtn" class="btn-action" style="background: var(--danger); color: #fff;">DELETE</button>
                <button onclick="closeModal('confirmModal')" class="btn-action btn-secondary">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Top Navigation -->
    <nav>
        <div id="brand-name">
            <img src="logo.png" alt="logo">
            PEDSTYLE 2K26
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="window.location.href='index.html'" class="btn-action btn-secondary"><i class="fas fa-arrow-left"></i> BACK</button>
            <button onclick="location.reload()" class="btn-action btn-secondary"><i class="fas fa-home"></i> HOME</button>
            <button onclick="openAdminModal()" id="navAdmin" class="btn-action"><i class="fas fa-user-shield"></i> ADMIN</button>
        </div>
    </nav>

    <div class="container">
        <!-- Admin Management Panel (Appears after Login) -->
        <div id="adminPanel" class="hidden">
            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="color: #fff; font-family: 'Orbitron'; font-size: 1.1rem;"><i class="fas fa-user-plus"></i> ADD / EDIT MEMBER</h3>
                    <button onclick="logoutAdmin()" class="btn-action btn-secondary" style="font-size: 0.75rem;"><i class="fas fa-sign-out-alt"></i> LOGOUT</button>
                </div>

                <div class="admin-grid" style="margin-bottom: 20px;">
                    <input type="hidden" id="editMemberId">
                    
                    <div class="input-group">
                        <label>ชื่อสมาชิก *</label>
                        <input type="text" id="newName" placeholder="เช่น Best Wellesley" onkeydown="if(event.key === 'Enter') saveMember()">
                    </div>

                    <div class="input-group">
                        <label>ลิงก์ Facebook (URL) *</label>
                        <input type="text" id="newFB" placeholder="https://facebook.com/..." onkeydown="if(event.key === 'Enter') saveMember()">
                    </div>

                    <div class="input-group">
                        <label>ตำแหน่ง (Role) *</label>
                        <select id="newRole">
                            <option value="leader">Leader</option>
                            <option value="founder">Founder</option>
                            <option value="member">Member</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="saveMember()" id="saveBtn" class="btn-action"><i class="fas fa-check"></i> SAVE DATA</button>
                    <button onclick="resetForm()" class="btn-action btn-secondary">RESET</button>
                </div>
            </div>
        </div>

        <!-- Roster Display Sections -->
        <div id="rosterDisplay">
            <!-- FOUNDERS -->
            <div id="section-founder" class="hidden">
                <div class="section-header">
                    <span class="header-line"></span>
                    <div class="section-title-badge">
                        <i class="fa-solid fa-crown header-icon" style="color: #f3d48b;"></i>
                        <span id="titleFounder">FOUNDERS</span>
                        <span class="section-count" id="countFounder">[0]</span>
                    </div>
                    <span class="header-line"></span>
                </div>
                <div class="roster-grid" id="founderList"></div>
            </div>

            <!-- LEADERS -->
            <div id="section-leader" class="hidden">
                <div class="section-header">
                    <span class="header-line"></span>
                    <div class="section-title-badge">
                        <i class="fa-solid fa-crown header-icon"></i>
                        <span id="titleLeader">LEADERS</span>
                        <span class="section-count" id="countLeader">[0]</span>
                    </div>
                    <span class="header-line"></span>
                </div>
                <div class="roster-grid" id="leaderList"></div>
            </div>

            <!-- MEMBERS -->
            <div id="section-member" class="hidden">
                <div class="section-header">
                    <span class="header-line"></span>
                    <div class="section-title-badge">
                        <i class="fa-solid fa-users header-icon"></i>
                        <span id="titleMember">MEMBERS</span>
                        <span class="section-count" id="countMember">[0]</span>
                    </div>
                    <span class="header-line"></span>
                </div>
                <div class="roster-grid" id="memberList"></div>
            </div>

            <div id="emptyNotice" class="empty-placeholder">
                <i class="fas fa-user-shield" style="font-size: 2.5rem; margin-bottom: 15px; opacity: 0.4;"></i>
                <p>ยังไม่มีรายชื่อสมาชิก</p>
                <p style="font-size: 0.8rem; opacity: 0.5; margin-top: 5px;">(กดปุ่ม ADMIN เพื่อเข้าสู่ระบบและเริ่มเพิ่มสมาชิก)</p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration (supports online database + local fallback)
        let db = null;
        try {
            const firebaseConfig = {
                databaseURL: "https://dernyoungsay-default-rtdb.asia-southeast1.firebasedatabase.app/"
            };
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.log("Firebase initialized locally");
        }

        let isAdmin = false;
        let deleteTargetId = null;

        // Clear previous sample names so it starts fresh
        localStorage.removeItem('pedstyle_roster_sample');

        function openAdminModal() {
            if(isAdmin) {
                document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
                return;
            }
            document.getElementById('adminPassInput').value = "";
            document.getElementById('loginModal').style.display = 'flex';
            setTimeout(() => document.getElementById('adminPassInput').focus(), 100);
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function handleAdminLogin() {
            const pass = document.getElementById('adminPassInput').value;
            if(pass === "adminpedboys") {
                isAdmin = true;
                closeModal('loginModal');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('navAdmin').innerHTML = '<i class="fas fa-user-check"></i> ADMIN MODE';
                showToast("LOGGED IN AS ADMIN");
                document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
                renderRoster();
            } else {
                closeModal('loginModal');
                triggerJumpscare();
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('navAdmin').innerHTML = '<i class="fas fa-user-shield"></i> ADMIN';
            showToast("LOGGED OUT");
            renderRoster();
        }

        function triggerJumpscare() {
            const container = document.getElementById('video-jumpscare');
            container.innerHTML = `<iframe src="https://www.youtube.com/embed/u8UdAAX_n28?autoplay=1&controls=0&start=13&mute=0" allow="autoplay"></iframe>`;
            container.style.display = 'block';
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                container.style.display = 'none';
                container.innerHTML = '';
                document.body.style.overflow = 'auto';
            }, 4000);
        }

        function showToast(m) {
            const t = document.createElement('div'); t.className = 'toast fade-in';
            t.innerText = m; document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // Render Member Cards
        function renderRoster() {
            if (db) {
                db.ref('roster').on('value', snap => {
                    let data = snap.val();
                    if(!data) {
                        const localData = localStorage.getItem('pedstyle_roster');
                        data = localData ? JSON.parse(localData) : {};
                    }
                    displayRosterData(data);
                }, err => {
                    const localData = localStorage.getItem('pedstyle_roster');
                    displayRosterData(localData ? JSON.parse(localData) : {});
                });
            } else {
                const localData = localStorage.getItem('pedstyle_roster');
                displayRosterData(localData ? JSON.parse(localData) : {});
            }
        }

        function displayRosterData(data) {
            const lists = { founder: 'founderList', leader: 'leaderList', member: 'memberList' };
            const sections = { founder: 'section-founder', leader: 'section-leader', member: 'section-member' };
            const counts = { founder: 'countFounder', leader: 'countLeader', member: 'countMember' };
            const countCounters = { founder: 0, leader: 0, member: 0 };

            Object.values(lists).forEach(id => document.getElementById(id).innerHTML = "");
            Object.values(sections).forEach(id => document.getElementById(id).classList.add('hidden'));

            let totalCount = 0;

            if(data && Object.keys(data).length > 0) {
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    const role = item.role || 'member';
                    if (!lists[role]) return;

                    totalCount++;
                    countCounters[role]++;

                    const card = document.createElement('div');
                    card.className = 'member-card fade-in';

                    // Facebook button
                    const fbHTML = item.fb ? `<a href="${item.fb}" target="_blank" class="card-social-btn" title="Facebook"><i class="fab fa-facebook-f"></i></a>` : '';

                    card.innerHTML = `
                        <div style="width: 100%;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <div class="card-main">
                                    <div class="avatar-wrap">
                                        <img src="logo.png" alt="PEDSTYLE" class="card-avatar">
                                        <span class="status-dot"></span>
                                    </div>
                                    <div class="card-info">
                                        <div class="card-name">${item.name}</div>
                                        <div class="card-role-badge">${role.toUpperCase()}</div>
                                    </div>
                                </div>

                                <div class="card-actions">
                                    <i class="fa-solid fa-crown role-crown"></i>
                                    <div class="social-btns">
                                        ${fbHTML}
                                    </div>
                                </div>
                            </div>

                            ${isAdmin ? `
                            <div class="admin-mini-controls">
                                <button class="mini-btn" onclick="prepareEdit('${id}', '${item.name.replace(/'/g, "\\'")}', '${(item.fb||'').replace(/'/g, "\\'")}', '${role}')"><i class="fas fa-edit"></i> แก้ไข</button>
                                <button class="mini-btn" style="color: #ff6b81;" onclick="askDeleteMember('${id}', '${item.name.replace(/'/g, "\\'")}')"><i class="fas fa-trash"></i> ลบ</button>
                            </div>` : ''}
                        </div>
                    `;

                    document.getElementById(lists[role]).appendChild(card);
                    document.getElementById(sections[role]).classList.remove('hidden');
                });
            }

            // Empty state notice
            const emptyNotice = document.getElementById('emptyNotice');
            if (emptyNotice) {
                if (totalCount === 0) emptyNotice.classList.remove('hidden');
                else emptyNotice.classList.add('hidden');
            }

            // Update Counts in Section Headers
            Object.keys(countCounters).forEach(r => {
                if(document.getElementById(counts[r])) {
                    document.getElementById(counts[r]).innerText = `[${countCounters[r]}]`;
                }
            });
        }

        function saveMember() {
            if(!isAdmin) return;
            const id = document.getElementById('editMemberId').value;
            const nameVal = document.getElementById('newName').value.trim();
            const fbVal = document.getElementById('newFB').value.trim();
            const roleVal = document.getElementById('newRole').value;

            if(!nameVal) return showToast("กรุณาใส่ชื่อสมาชิก");
            if(!fbVal) return showToast("กรุณาใส่ลิงก์ Facebook");

            const data = {
                name: nameVal,
                fb: fbVal,
                role: roleVal
            };

            // Save to Firebase
            if (db) {
                if(id) db.ref('roster/' + id).update(data);
                else db.ref('roster').push(data);
            }

            // Also save locally as backup
            let localData = localStorage.getItem('pedstyle_roster');
            let rosterObj = localData ? JSON.parse(localData) : {};
            const targetId = id || ('local_' + Date.now());
            rosterObj[targetId] = data;
            localStorage.setItem('pedstyle_roster', JSON.stringify(rosterObj));

            showToast(id ? "อัปเดตข้อมูลสำเร็จ" : "เพิ่มสมาชิกสำเร็จ");
            resetForm();
            renderRoster();
        }

        function askDeleteMember(id, name) {
            deleteTargetId = id;
            document.getElementById('deleteMemberName').innerText = `คุณต้องการลบ "${name}" ใช่หรือไม่?`;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        document.getElementById('confirmDeleteBtn').onclick = () => {
            if(deleteTargetId) {
                if(db) db.ref('roster/' + deleteTargetId).remove();
                
                let localData = localStorage.getItem('pedstyle_roster');
                if(localData) {
                    let rosterObj = JSON.parse(localData);
                    delete rosterObj[deleteTargetId];
                    localStorage.setItem('pedstyle_roster', JSON.stringify(rosterObj));
                }
                
                showToast("ลบข้อมูลเรียบร้อย");
                closeModal('confirmModal');
                renderRoster();
            }
        };

        function prepareEdit(id, name, fb, role) {
            document.getElementById('editMemberId').value = id;
            document.getElementById('newName').value = name;
            document.getElementById('newFB').value = (fb === '#') ? '' : fb;
            document.getElementById('newRole').value = role;
            document.getElementById('saveBtn').innerHTML = "<i class='fas fa-save'></i> UPDATE DATA";
            document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editMemberId').value = "";
            document.getElementById('newName').value = "";
            document.getElementById('newFB').value = "";
            document.getElementById('saveBtn').innerHTML = "<i class='fas fa-check'></i> SAVE DATA";
        }

        renderRoster();
    </script>
</body>
</html>
