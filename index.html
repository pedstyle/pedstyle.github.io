<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEDSTYLE</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-glow: rgba(255, 255, 255, 0.15);
            --accent-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            position: relative;
        }

        /* --- Overlay --- */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.7, 0, 0.3, 1), visibility 1.2s;
        }
        
        #overlay.fade-out { 
            opacity: 0; 
            visibility: hidden;
        }

        .enter-text-wrapper {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        .fingerprint-icon {
            font-size: 4rem;
            color: #ffffff;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
            animation: pulse-glow 2s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6)); }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .main-enter-text {
            font-size: 1.2rem;
            letter-spacing: 12px; 
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .sub-enter-text {
            font-size: 0.6rem;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        /* --- Background --- */
        .bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #14141c 0%, #050508 100%);
        }
        body.loaded .bg-wrapper { transform: scale(1); }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* --- Nav --- */
        .top-nav {
            position: fixed;
            top: 25px;
            width: 90%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 1s ease 0.5s;
        }
        body.loaded .top-nav { opacity: 1; transform: translateY(0); }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .nav-logo img { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,255,255,0.7)); }
        .nav-text { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; color: rgba(255,255,255,0.5); letter-spacing: 2px; }

        /* --- Content --- */
        .container {
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 0 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.8s;
        }
        body.loaded .container { opacity: 1; transform: translateY(0); }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 15px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
        }

        .subtext {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .btn {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 280px;
            height: 75px;
            text-decoration: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .btn-text-main { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; letter-spacing: 3px; font-weight: 700; color: #fff; pointer-events: none; }
        .btn-text-sub { font-size: 0.5rem; letter-spacing: 2px; color: rgba(255,255,255,0.3); margin-top: 5px; pointer-events: none; }

        /* --- Music Player --- */
        .music-player {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: all 1s ease 1s;
        }
        body.loaded .music-player { opacity: 1; }

        .album-art {
            width: 50px; height: 50px; border-radius: 12px;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .playing .album-art { animation: pulseArt 2s infinite ease-in-out; }
        @keyframes pulseArt { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .album-art img { width: 100%; height: 100%; object-fit: cover; }
        
        .player-controls-mini { flex-grow: 1; margin-left: 15px; overflow: hidden; }
        .music-title-mini {
            font-size: 0.6rem; color: rgba(255,255,255,0.9);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 6px; font-family: 'Inter', sans-serif;
        }
        .ctrl-btns { display: flex; align-items: center; gap: 20px; }
        .play-btn { background: none; border: none; color: #fff; font-size: 0.9rem; cursor: pointer; opacity: 0.7; transition: 0.3s; }
        .play-btn:hover { opacity: 1; transform: scale(1.1); }

        footer {
            margin-top: 40px;
            font-size: 0.55rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
        }

        #youtube-player { position: absolute; top: -1000px; left: -1000px; visibility: hidden; }

        @media (max-width: 480px) {
            h1 { letter-spacing: 8px; }
            .top-nav { width: 85%; }
            .music-player { width: 280px; }
        }
    </style>
</head>
<body>

    <!-- Overlay Click to enter -->
    <div id="overlay" onclick="startWebsite()">
        <div class="enter-text-wrapper">
            <i class="fa-solid fa-fingerprint fingerprint-icon"></i>
            <div class="main-enter-text">CLICK TO ENTER</div>
            <div class="sub-enter-text">SYSTEM PEDSTYLE</div>
        </div>
    </div>

    <!-- Background & effects -->
    <div class="bg-wrapper"></div>
    <div class="vignette"></div>

    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="#" class="nav-logo">
            <img src="logo.png" alt="icon">
            PEDSTYLE
        </a>
        <div class="nav-text">V.2026.1</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1>PEDSTYLE</h1> 
        <div class="subtext">The Original Legacy Member</div>

        <div class="button-group">
            <a href="member.html" class="btn">
                <span class="btn-text-main">MEMBER ENTER</span>
                <span class="btn-text-sub">MEMBER 2K26</span>
            </a>
        </div>

        <footer>
            &copy; 2K26 SYSTEM BY PEDSTYLE
        </footer>
    </div>

    <!-- Music Player -->
    <div class="music-player" id="player-container">
        <div class="album-art">
            <img src="https://img.youtube.com/vi/JcEeQh4Ov4M/maxresdefault.jpg" alt="Cover" id="music-cover">
        </div>
        <div class="player-controls-mini">
            <div class="music-title-mini" id="music-title">Initializing...</div>
            <div class="ctrl-btns">
                <i class="fas fa-step-backward play-btn"></i>
                <button class="play-btn" id="master-play" aria-label="Play/Pause">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
                <i class="fas fa-step-forward play-btn"></i>
            </div>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        // โหลด YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var videoId = 'JcEeQh4Ov4M'; // PUN - รักให้เธอได้รู้ (Proof.)

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', 
                width: '0',
                videoId: videoId,
                playerVars: { 
                    'autoplay': 0, 
                    'loop': 1, 
                    'playlist': videoId,
                    'controls': 0,
                    'showinfo': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // เริ่มเข้าสู่เว็บไซต์เมื่อคลิก Overlay
        function startWebsite() {
            document.body.classList.add('loaded');
            const overlay = document.getElementById('overlay');
            overlay.classList.add('fade-out');
            
            if (player && typeof player.playVideo === 'function') {
                player.unMute();
                player.setVolume(80);
                player.playVideo();
            }
        }

        function onPlayerReady(event) {
            updateTitle();
        }

        function updateTitle() {
            try {
                const videoData = player.getVideoData();
                if (videoData && videoData.title) {
                    document.getElementById('music-title').innerText = videoData.title;
                } else {
                    document.getElementById('music-title').innerText = "System Audio Playing";
                }
            } catch(e) {
                document.getElementById('music-title').innerText = "System Audio Active";
            }
        }

        function onPlayerStateChange(event) {
            const icon = document.getElementById('play-icon');
            const cont = document.getElementById('player-container');
            
            // 1 = Playing, 2 = Paused
            if (event.data == YT.PlayerState.PLAYING) {
                icon.className = 'fas fa-pause';
                cont.classList.add('playing');
                updateTitle();
            } else {
                icon.className = 'fas fa-play';
                cont.classList.remove('playing');
            }
        }

        // ปุ่มควบคุม Play / Pause
        document.getElementById('master-play').addEventListener('click', function() {
            if (!player || typeof player.getPlayerState !== 'function') return;
            const state = player.getPlayerState();
            if (state == YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        // ป้องกันการคลิกขวา
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
