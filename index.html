<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEDSTYLE</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-glow: rgba(255, 255, 255, 0.15);
            --accent-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            position: relative;
        }

        /* --- Overlay --- */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.7, 0, 0.3, 1), visibility 1.2s;
        }
        
        #overlay.fade-out { 
            opacity: 0; 
            visibility: hidden;
            pointer-events: none;
        }

        .enter-text-wrapper {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        .fingerprint-icon {
            font-size: 4rem;
            color: #ffffff;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
            animation: pulse-glow 2s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6)); }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .main-enter-text {
            font-size: 1.2rem;
            letter-spacing: 12px; 
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .sub-enter-text {
            font-size: 0.6rem;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        /* --- Background --- */
        .bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #14141c 0%, #050508 100%);
        }
        body.loaded .bg-wrapper { transform: scale(1); }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* --- Nav --- */
        .top-nav {
            position: fixed;
            top: 25px;
            width: 90%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 1s ease 0.5s;
        }
        body.loaded .top-nav { opacity: 1; transform: translateY(0); }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .nav-logo img { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,255,255,0.7)); }
        .nav-text { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; color: rgba(255,255,255,0.5); letter-spacing: 2px; }

        /* --- Content --- */
        .container {
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 0 30px;
            margin-top: -50px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.8s;
        }
        body.loaded .container { opacity: 1; transform: translateY(0); }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 15px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
        }

        .subtext {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .btn {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 280px;
            height: 75px;
            text-decoration: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .btn-text-main { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; letter-spacing: 3px; font-weight: 700; color: #fff; pointer-events: none; }
        .btn-text-sub { font-size: 0.5rem; letter-spacing: 2px; color: rgba(255,255,255,0.3); margin-top: 5px; pointer-events: none; }

        /* --- Floating Vinyl Music Player (Right Side) --- */
        .vinyl-player-wrapper {
            position: fixed;
            bottom: 35px;
            right: 35px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transform: translateX(30px);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1) 0.8s;
        }
        body.loaded .vinyl-player-wrapper {
            opacity: 1;
            transform: translateX(0);
        }

        .vinyl-info-box {
            background: rgba(12, 12, 16, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px 14px;
            max-width: 240px;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .vinyl-player-wrapper:hover .vinyl-info-box {
            opacity: 1;
            transform: translateX(0);
        }
        .vinyl-song-title {
            font-size: 0.65rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
        .vinyl-status {
            font-size: 0.5rem;
            color: rgba(255,255,255,0.4);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            margin-top: 3px;
        }

        /* Vinyl Disc Record */
        .vinyl-disc {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: 
                radial-gradient(circle, #080808 30%, #181818 32%, #080808 35%, #1c1c1c 38%, #080808 42%, #181818 46%, #080808 50%, #1c1c1c 55%, #080808 60%, #151515 65%, #080808 70%),
                #111;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.05);
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            user-select: none;
        }
        .vinyl-disc:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.25);
        }

        /* Spinning Animation */
        .vinyl-disc-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateVinyl 6s linear infinite;
            animation-play-state: paused;
            position: relative;
        }
        .playing .vinyl-disc-inner {
            animation-play-state: running;
        }
        .playing .vinyl-disc {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.3);
        }

        @keyframes rotateVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Center Album Art Label */
        .vinyl-label {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .vinyl-label img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Center Spindle Hole */
        .vinyl-center-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #000;
            border: 1.5px solid #fff;
            border-radius: 50%;
            z-index: 5;
        }

        /* Play / Pause overlay icon on hover */
        .vinyl-action-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.9rem;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s ease;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
            pointer-events: none;
        }
        .vinyl-disc:hover .vinyl-action-icon {
            opacity: 1;
        }

        footer {
            margin-top: 40px;
            font-size: 0.55rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
        }

        #youtube-player { position: absolute; top: -1000px; left: -1000px; visibility: hidden; }

        @media (max-width: 480px) {
            h1 { letter-spacing: 8px; }
            .top-nav { width: 85%; }
            .vinyl-player-wrapper {
                bottom: 20px;
                right: 20px;
            }
            .vinyl-disc {
                width: 65px;
                height: 65px;
            }
            .vinyl-label {
                width: 30px;
                height: 30px;
            }
            .vinyl-info-box {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Overlay Click to enter -->
    <div id="overlay" onclick="startWebsite()">
        <div class="enter-text-wrapper">
            <i class="fa-solid fa-fingerprint fingerprint-icon"></i>
            <div class="main-enter-text">CLICK TO ENTER</div>
            <div class="sub-enter-text">SYSTEM PEDSTYLE</div>
        </div>
    </div>

    <!-- Background & effects -->
    <div class="bg-wrapper"></div>
    <div class="vignette"></div>

    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="#" class="nav-logo">
            <img src="logo.png" alt="icon">
            PEDSTYLE
        </a>
        <div class="nav-text">V.2026.1</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1>PEDSTYLE</h1> 
        <div class="subtext">The Original Legacy Member</div>

        <div class="button-group">
            <a href="member.html" class="btn">
                <span class="btn-text-main">MEMBER ENTER</span>
                <span class="btn-text-sub">MEMBER 2K26</span>
            </a>
        </div>

        <footer>
            &copy; 2K26 SYSTEM BY PEDSTYLE
        </footer>
    </div>

    <!-- Vinyl Music Player (Right Side) -->
    <div class="vinyl-player-wrapper" id="player-container">
        <div class="vinyl-info-box">
            <div class="vinyl-song-title" id="music-title">The Weeknd, JENNIE - One Of The Girls</div>
            <div class="vinyl-status" id="music-status">CLICK DISC TO PLAY/PAUSE</div>
        </div>

        <div class="vinyl-disc" id="master-play" title="Click to Play / Pause">
            <div class="vinyl-disc-inner">
                <div class="vinyl-label">
                    <img src="https://img.youtube.com/vi/f1r0XZLNlGQ/hqdefault.jpg" alt="Cover" id="music-cover">
                </div>
                <div class="vinyl-center-hole"></div>
            </div>
            <i class="fas fa-play vinyl-action-icon" id="play-icon"></i>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        // โหลด YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var videoId = 'f1r0XZLNlGQ'; // The Weeknd, JENNIE & Lily Rose Depp - One Of The Girls

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', 
                width: '0',
                videoId: videoId,
                playerVars: { 
                    'autoplay': 0, 
                    'loop': 1, 
                    'playlist': videoId,
                    'controls': 0,
                    'showinfo': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // บันทึกตำแหน่งวินาทีเพลงต่อเนื่อง
        setInterval(() => {
            if (player && typeof player.getCurrentTime === 'function' && typeof player.getPlayerState === 'function') {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    localStorage.setItem('ped_music_time', player.getCurrentTime());
                    localStorage.setItem('ped_music_playing', 'true');
                    localStorage.setItem('ped_music_stamp', Date.now());
                } else if (state === YT.PlayerState.PAUSED) {
                    localStorage.setItem('ped_music_playing', 'false');
                }
            }
        }, 200);

        // เริ่มเข้าสู่เว็บไซต์เมื่อคลิก Overlay
        function startWebsite() {
            sessionStorage.setItem('ped_entered', 'true');
            document.body.classList.add('loaded');
            const overlay = document.getElementById('overlay');
            overlay.classList.add('fade-out');
            
            resumeOrPlayAudio();
        }

        function resumeOrPlayAudio() {
            if (player && typeof player.playVideo === 'function') {
                player.unMute();
                player.setVolume(80);

                const savedTime = parseFloat(localStorage.getItem('ped_music_time') || '0');
                const wasPlaying = localStorage.getItem('ped_music_playing') !== 'false';
                const lastStamp = parseInt(localStorage.getItem('ped_music_stamp') || '0');

                let seekToTime = savedTime;
                if (lastStamp > 0 && wasPlaying) {
                    const elapsed = (Date.now() - lastStamp) / 1000;
                    if (elapsed < 60) {
                        seekToTime += elapsed;
                    }
                }

                if (seekToTime > 1) {
                    player.seekTo(seekToTime, true);
                }
                player.playVideo();
            }
        }

        // Auto-resume if user already entered in this session
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('ped_entered') === 'true') {
                document.body.classList.add('loaded');
                const overlay = document.getElementById('overlay');
                if (overlay) overlay.classList.add('fade-out');
            }
        });

        function onPlayerReady(event) {
            updateTitle();
            if (sessionStorage.getItem('ped_entered') === 'true') {
                resumeOrPlayAudio();
            }
        }

        function updateTitle() {
            try {
                const videoData = player.getVideoData();
                if (videoData && videoData.title) {
                    document.getElementById('music-title').innerText = videoData.title;
                } else {
                    document.getElementById('music-title').innerText = "The Weeknd, JENNIE - One Of The Girls";
                }
            } catch(e) {
                document.getElementById('music-title').innerText = "The Weeknd, JENNIE - One Of The Girls";
            }
        }

        function onPlayerStateChange(event) {
            const icon = document.getElementById('play-icon');
            const cont = document.getElementById('player-container');
            const status = document.getElementById('music-status');
            
            // 1 = Playing, 2 = Paused
            if (event.data == YT.PlayerState.PLAYING) {
                icon.className = 'fas fa-pause vinyl-action-icon';
                cont.classList.add('playing');
                if (status) status.innerText = "NOW PLAYING";
                updateTitle();
            } else {
                icon.className = 'fas fa-play vinyl-action-icon';
                cont.classList.remove('playing');
                if (status) status.innerText = "PAUSED";
            }
        }

        // ปุ่มควบคุม Play / Pause
        document.getElementById('master-play').addEventListener('click', function() {
            if (!player || typeof player.getPlayerState !== 'function') return;
            const state = player.getPlayerState();
            if (state == YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        // ป้องกันการคลิกขวา
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
